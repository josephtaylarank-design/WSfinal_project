<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <!-- Left side: branding panel -->
    <aside class="brand">
      <div class="brand-inner">
        <div class="logo">SR</div>
        <h1>Student<br>Registration</h1>
        <p>Create your student account in three quick steps.</p>
        <ol class="steps">
          <li><span>1</span> Personal information</li>
          <li><span>2</span> Academic details</li>
          <li><span>3</span> Account security</li>
        </ol>
        <small>All fields marked * are required.</small>
      </div>
    </aside>

    <!-- Right side: form panel -->
    <main class="form-panel">
      <!-- novalidate: we do our own validation in script.js -->
      <form id="registrationForm" novalidate>

        <!-- ===== Step 1 ===== -->
        <section class="section">
          <h2 class="section-title"><span>1</span> Personal Information</h2>

          <div class="grid">
            <div class="form-group">
              <label for="studentId">Student ID *</label>
              <input type="text" id="studentId" name="studentId"
                     placeholder="e.g. 2024-00123"
                     data-label="Student ID"
                     data-format="YYYY-NNNNN">
              <span class="error-message" id="studentId-error"></span>
            </div>

            <div class="form-group">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" name="fullName"
                     placeholder="Juan Dela Cruz"
                     data-label="Full name"
                     data-min="3">
              <span class="error-message" id="fullName-error"></span>
            </div>

            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email"
                     placeholder="juan@example.com"
                     data-label="Email">
              <span class="error-message" id="email-error"></span>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="text" id="phone" name="phone"
                     placeholder="09123456789"
                     data-label="Phone number"
                     data-format="11 digits starting with 09">
              <span class="error-message" id="phone-error"></span>
            </div>

            <div class="form-group">
              <label for="dob">Date of Birth *</label>
              <input type="date" id="dob" name="dob" data-label="Date of birth" data-min-age="15">
              <span class="error-message" id="dob-error"></span>
            </div>

            <div class="form-group" id="genderGroup">
              <label>Gender *</label>
              <div class="pill-row">
                <label class="pill"><input type="radio" name="gender" value="Male"><span>Male</span></label>
                <label class="pill"><input type="radio" name="gender" value="Female"><span>Female</span></label>
                <label class="pill"><input type="radio" name="gender" value="Other"><span>Other</span></label>
              </div>
              <span class="error-message" id="gender-error"></span>
            </div>
          </div>
        </section>

        <!-- ===== Step 2 ===== -->
        <section class="section">
          <h2 class="section-title"><span>2</span> Academic Details</h2>

          <div class="grid">
            <div class="form-group">
              <label for="program">Program *</label>
              <select id="program" name="program" data-label="Program">
                <option value="">-- Select program --</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSIS">BS Information Systems</option>
                <option value="BSCpE">BS Computer Engineering</option>
              </select>
              <span class="error-message" id="program-error"></span>
            </div>

            <div class="form-group">
              <label for="yearLevel">Year Level *</label>
              <select id="yearLevel" name="yearLevel" data-label="Year level">
                <option value="">-- Select year --</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
              <span class="error-message" id="yearLevel-error"></span>
            </div>

            <div class="form-group full">
              <label for="address">Address *</label>
              <textarea id="address" name="address" rows="3"
                        placeholder="Street, Barangay, City, Province"
                        data-label="Address"
                        data-min="10"></textarea>
              <span class="error-message" id="address-error"></span>
            </div>
          </div>
        </section>

        <!-- ===== Step 3 ===== -->
        <section class="section">
          <h2 class="section-title"><span>3</span> Account Security</h2>

          <div class="grid">
            <div class="form-group">
              <label for="password">Password *</label>
              <div class="password-wrap">
                <input type="password" id="password" name="password"
                       placeholder="At least 8 characters"
                       data-label="Password"
                       data-min="8">
                <button type="button" class="toggle-btn" id="togglePassword"
                        data-target="password" data-state="hidden"
                        aria-label="Show password">Show</button>
              </div>
              <span class="error-message" id="password-error"></span>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password *</label>
              <div class="password-wrap">
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Re-enter password"
                       data-label="Confirm password">
                <button type="button" class="toggle-btn" id="toggleConfirm"
                        data-target="confirmPassword" data-state="hidden"
                        aria-label="Show confirm password">Show</button>
              </div>
              <span class="error-message" id="confirmPassword-error"></span>
            </div>
          </div>

          <div class="form-group agree-box">
            <label class="checkbox-row">
              <input type="checkbox" id="agree" name="agree">
              <span>I agree to the terms and conditions *</span>
            </label>
            <span class="error-message" id="agree-error"></span>
          </div>
        </section>

        <!-- Buttons -->
        <div class="button-row">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary">Submit Registration</button>
        </div>

        <!-- Success message -->
        <div id="successMessage" class="success-message hidden" role="status"></div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
